# =================================================================
# POLYMARKET <-> KALSHI PRODUCTION ARBITRAGE BOT CONFIGURATION
# =================================================================
# Capital preservation and correctness take priority over trade frequency.
# DRY RUN is enabled by default. Live execution requires explicit confirmation.

api:
  polymarket_clob_url: "https://clob.polymarket.com"
  polymarket_gamma_url: "https://gamma-api.polymarket.com"
  polymarket_ws_url: "wss://ws-subscriptions-clob.polymarket.com/ws/market"
  kalshi_base_url: "https://api.elections.kalshi.com/trade-api/v2"
  timeout_seconds: 8.0
  max_retries: 2
  retry_delay_seconds: 0.25

arbitrage:
  # Hard Positive-EV Gate Thresholds
  min_net_edge_pct: 0.025          # Require 2.5% net profit after ALL fees and slippage
  min_net_profit_dollars: 0.02     # Minimum $0.02 net profit (scaled for micro 1-contract sizing)
  
  # Duration Focus: Markets resolving in 24 hours or less
  max_hours_to_resolution: 24.0   # Max 24 hours to resolution (high turnover, low duration risk)
  min_minutes_to_resolution: 1.0  # Stop trading in the final 1.0 minute before settlement (safe buffer)
  
  # Stale Quote Protection
  max_quote_age_seconds: 2.0      # Reject market quotes older than 2.0 seconds
  
  # Friction & Leg Execution Buffers
  slippage_buffer_per_leg: 0.005  # 0.5% price buffer per leg
  adverse_leg_buffer_cents: 0.005 # $0.005 per share safety margin for execution friction
  annual_capital_cost_rate: 0.05  # 5% annual cost of locked capital
  
  # Fee Models
  polymarket_taker_fee_pct: 0.0   # 0% standard Polymarket taker fee (set > 0 for fee markets)
  kalshi_taker_fee_multiplier: 0.07 # Official Kalshi taker quadratic fee multiplier
  kalshi_fee_cap_dollars: 0.02    # $0.02 maximum fee cap per contract

risk:
  max_order_size_dollars: 1.0     # Strict $1.00 capital limit per bundle trade ($1 max per side)
  max_contracts_per_trade: 1.0    # Strict limit to 1 contract per trade
  min_order_size_dollars: 0.01    # Minimum trade size (allows single contracts down to 1 cent)
  max_market_exposure_dollars: 1.0 # Max exposure per single market pair ($1.00)
  max_total_exposure_dollars: 1.0  # Max global open exposure ($1.00)
  max_daily_loss_dollars: 1.0     # Stop trading if cumulative daily loss exceeds $1.00
  max_consecutive_failures: 2     # Trigger kill switch after 2 consecutive failed executions
  kill_switch_enabled: true

execution:
  dry_run: true                   # DEFAULT: Simulates execution with live real-time market data
  live_trading_confirmed: false   # SAFETY: Must be set to true alongside dry_run: false for live orders
  leg1_fill_timeout_seconds: 2.5  # Timeout waiting for Leg 1 fill before cancelling
  leg2_fill_timeout_seconds: 3.0  # Timeout waiting for Leg 2 fill before entering HEDGING
  auto_unwind_unhedged_leg: true  # Automatically unwind Leg 1 if Leg 2 fails to execute
  max_unwind_loss_pct: 0.03       # Max tolerated loss on emergency market unwind (3%)
  journal_path: "logs/execution_journal.jsonl"
  log_level: "INFO"

short_duration_series_whitelist:
  - "KXBTC15M"     # Strictly Bitcoin 15-Minute Recurring Up/Down Fixings ONLY
